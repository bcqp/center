name: weekly
on:
  workflow_dispatch:
    inputs:
      topic: {description: "Topic slug (optional; otherwise ranked from news)", required: false}
  schedule:
    - cron: "17 3 * * 1"
permissions:
  contents: write
  pull-requests: write
jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r pipeline/requirements.txt && pip install "git+https://github.com/tuhingm/open-econometric-systems.git#subdirectory=oes-engine"
      - run: python pipeline/run.py ${{ github.event.inputs.topic }}
      - name: Preview cards and tags for new pages
        run: |
          pip install playwright && python -m playwright install --with-deps chromium
          OG_MISSING=1 python tools/og_pages.py
          python tools/seo_links.py
      - name: Keep a preview of the whole site
        uses: actions/upload-artifact@v4
        with:
          name: preview-site
          path: |
            index.html
            404.html
            about
            research
            briefs
            data
            methodology
            policies
            people
            news
            contact
            search
            assets
          retention-days: 14
      - name: Publish automatically
        run: |
          if [ -z "$(git status --porcelain briefs content)" ]; then echo "nothing produced"; exit 0; fi
          git config user.name "bcqp-pipeline"; git config user.email "pipeline@users.noreply.github.com"
          git add -A -- briefs content assets sitemap.xml index.html feed.json
          git commit -m "Weekly brief (auto-published)"
          git pull --rebase origin main
          git push origin HEAD:main
